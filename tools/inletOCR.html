<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INLET OCR</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;}

.header{
background:#005baa;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
font-size:20px;
}

.backBtn{
background:white;
color:#005baa;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1100px;
margin:40px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
color:#005baa;
border-bottom:2px solid #005baa;
padding-bottom:8px;
}

.btn{
background:#005baa;
color:white;
border:none;
padding:12px 20px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-right:10px;
}

input[type=file]{display:none;}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{background:#005baa;color:white;padding:10px;}
td{padding:10px;border-bottom:1px solid #ddd;}

td[contenteditable]{background:#fff8e1;}

.green{background:#d9f2e3;}
.orange{background:#fff2cc;}
.red{background:#ffd6d6;}

</style>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<div class="header">
<span>Sistema Operativo Interno</span>
<button class="backBtn" onclick="history.back()">Volver</button>
</div>

<div class="container">

<h2>INLET OCR</h2>

<label class="btn">
Subir Maestro
<input type="file" id="fileMaster" accept=".xlsx">
</label>

<label class="btn">
Subir PDF
<input type="file" id="filePDF" accept="application/pdf">
</label>

<button id="procesarBtn" class="btn" style="display:none;" onclick="procesarFinal()">Procesar</button>

<div id="status"></div>

<table id="tabla">
<thead>
<tr>
<th>BL</th>
<th>Cliente</th>
<th>Ciudad</th>
<th>Palets</th>
<th>Bultos</th>
<th>Peso</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="resultado"></div>

</div>

<script>

let masterData=[];
let ocrData=[];
let masterLoaded=false;
let pdfLoaded=false;

/* NORMALIZAR */
function normalize(s){
return (s||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();
}

/* CONTROL BOTÓN */
function checkReady(){
document.getElementById("procesarBtn").style.display =
(masterLoaded && pdfLoaded) ? "inline-block" : "none";
}

/* CARGAR EXCEL */
document.getElementById("fileMaster").addEventListener("change",async e=>{
const file=e.target.files[0];
const data=await file.arrayBuffer();
const wb=XLSX.read(data,{type:'array'});
const sheet=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
masterData=sheet;
masterLoaded=true;
checkReady();
});

/* OCR PDF CON RECORTE */
document.getElementById("filePDF").addEventListener("change",async e=>{

document.getElementById("status").innerText="Procesando OCR...";

const file=e.target.files[0];

const pdf = await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
const page = await pdf.getPage(1);

const viewport = page.getViewport({scale:2});
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

canvas.width = viewport.width;
canvas.height = viewport.height;

await page.render({canvasContext:ctx, viewport}).promise;

/* 🔥 RECORTE CENTRAL (AJUSTABLE) */
const cropX = canvas.width * 0.05;
const cropY = canvas.height * 0.25;
const cropW = canvas.width * 0.9;
const cropH = canvas.height * 0.5;

const cropped = ctx.getImageData(cropX, cropY, cropW, cropH);

const tempCanvas = document.createElement("canvas");
tempCanvas.width = cropW;
tempCanvas.height = cropH;
tempCanvas.getContext("2d").putImageData(cropped,0,0);

const {data:{text}} = await Tesseract.recognize(tempCanvas,"spa");

procesarTexto(text);

pdfLoaded=true;
checkReady();

});

/* PARSEO INTELIGENTE */
function procesarTexto(text){

const tbody=document.querySelector("#tabla tbody");
tbody.innerHTML="";

const lineas=text.split("\n");

lineas.forEach(l=>{

/* Detectar línea válida con números */
const match=l.match(/(\d{6,}(?:#\d+)*)\s+(.*?)\s+([A-Za-zÁÉÍÓÚñ\s]+)\s+(\d{1,2})\s+(\d+)\s+([\d.,]+)/);

if(match){

const bl=match[1];
const cliente=match[2];
const ciudad=match[3];
const palets=match[4];
const bultos=match[5];
const peso=match[6];

const tr=document.createElement("tr");

tr.innerHTML=`
<td contenteditable="true">${bl}</td>
<td contenteditable="true">${cliente}</td>
<td contenteditable="true">${ciudad}</td>
<td contenteditable="true">${palets}</td>
<td contenteditable="true">${bultos}</td>
<td contenteditable="true">${peso}</td>
`;

tbody.appendChild(tr);

}

});

document.getElementById("status").innerText="Revisa los datos antes de procesar";

}

/* MATCH FINAL */
function procesarFinal(){

const filas=document.querySelectorAll("#tabla tbody tr");

let html="<table><tr><th>BL</th><th>Cliente</th><th>Ciudad</th><th>Tier</th><th>Palets</th><th>Bultos</th><th>Peso</th></tr>";

filas.forEach(f=>{

const bl=f.children[0].innerText;
const cliente=f.children[1].innerText;
const ciudad=f.children[2].innerText;
const palets=f.children[3].innerText;
const bultos=f.children[4].innerText;
const peso=f.children[5].innerText;

let tier="NO";
let tipo="red";

const match=masterData.find(m=>
normalize(m.DESTINATARIO||m.destinatario).includes(normalize(cliente)) &&
normalize(m.POBLACION||m.poblacion).includes(normalize(ciudad))
);

if(match){
tier=match.TIERS || match.tiers || "-";
tipo="green";
}

html+=`<tr class="${tipo}">
<td>${bl}</td>
<td>${cliente}</td>
<td>${ciudad}</td>
<td>${tier}</td>
<td>${palets}</td>
<td>${bultos}</td>
<td>${peso}</td>
</tr>`;

});

html+="</table>";

document.getElementById("resultado").innerHTML=html;

}

</script>

</body>
</html>
