<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INLET OCR</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;}

.header{
background:#005baa;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
font-size:20px;
}

.backBtn{
background:white;
color:#005baa;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1100px;
margin:40px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
color:#005baa;
border-bottom:2px solid #005baa;
padding-bottom:8px;
}

.btn{
background:#005baa;
color:white;
border:none;
padding:12px 20px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-right:10px;
}

input[type=file]{display:none;}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{background:#005baa;color:white;padding:10px;}
td{padding:10px;border-bottom:1px solid #ddd;}

td[contenteditable]{background:#fff8e1;}

.green{background:#d9f2e3;}
.red{background:#ffd6d6;}
</style>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<div class="header">
<span>Sistema Operativo Interno</span>
<button class="backBtn" onclick="history.back()">Volver</button>
</div>

<div class="container">

<h2>INLET OCR</h2>

<label class="btn">
Subir Maestro
<input type="file" id="fileMaster" accept=".xlsx">
</label>

<label class="btn">
Subir PDF
<input type="file" id="filePDF" accept="application/pdf">
</label>

<button id="procesarBtn" class="btn" style="display:none;">Procesar</button>

<div id="status"></div>

<table id="tabla">
<thead>
<tr>
<th>BL</th>
<th>Destinatario</th>
<th>Población</th>
<th>Palets</th>
<th>Bultos</th>
<th>Peso</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="resultado"></div>

</div>

<script>

let masterData=[];
let masterLoaded=false;

let pdfFile=null;
let pdfLoaded=false;

/* NORMALIZAR */
function normalize(s){
return (s||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();
}

/* CONTROL BOTÓN */
function checkReady(){
document.getElementById("procesarBtn").style.display =
(masterLoaded && pdfLoaded) ? "inline-block" : "none";
}

/* CARGAR MAESTRO */
document.getElementById("fileMaster").addEventListener("change", async e=>{
const file=e.target.files[0];
const data=await file.arrayBuffer();
const wb=XLSX.read(data,{type:'array'});
const sheet=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
masterData=sheet;

masterLoaded=true;
checkReady();
});

/* GUARDAR PDF */
document.getElementById("filePDF").addEventListener("change", e=>{
pdfFile = e.target.files[0];
pdfLoaded = true;
checkReady();
});

/* BOTÓN PROCESAR */
document.getElementById("procesarBtn").addEventListener("click", procesarFinal);

/* OCR + PARSEO */
async function procesarFinal(){

document.getElementById("status").innerText="Procesando OCR...";

const pdf = await pdfjsLib.getDocument(URL.createObjectURL(pdfFile)).promise;
const page = await pdf.getPage(1);

const viewport = page.getViewport({scale:2});
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

canvas.width = viewport.width;
canvas.height = viewport.height;

await page.render({canvasContext:ctx, viewport}).promise;

/* ✅ RECORTE EXACTO CON TUS COORDENADAS */
const cropX = 40;
const cropY = 373;
const cropW = 1400 - 40;
const cropH = 873 - 373;

const cropped = ctx.getImageData(cropX, cropY, cropW, cropH);

const tempCanvas = document.createElement("canvas");
tempCanvas.width = cropW;
tempCanvas.height = cropH;
tempCanvas.getContext("2d").putImageData(cropped,0,0);

/* OCR */
const {data:{text}} = await Tesseract.recognize(tempCanvas,"spa");

/* PARSEO */
procesarTexto(text);

document.getElementById("status").innerText="Revisa los datos antes de procesar";

}

/* PARSEO MEJORADO */
function procesarTexto(text){

const tbody=document.querySelector("#tabla tbody");
tbody.innerHTML="";

const lineas=text.split("\n");

lineas.forEach(l=>{

l = l.trim();
if(l.length < 20) return;

/* SEPARAR COLUMNAS */
const partes = l.split(/\s{2,}/);

if(partes.length >= 6){

const tr=document.createElement("tr");

tr.innerHTML=`
<td contenteditable="true">${partes[0]}</td>
<td contenteditable="true">${partes[1]}</td>
<td contenteditable="true">${partes[2]}</td>
<td contenteditable="true">${partes[3]}</td>
<td contenteditable="true">${partes[4]}</td>
<td contenteditable="true">${partes[5]}</td>
`;

tbody.appendChild(tr);

}

});

}

/* MATCH FINAL */
function procesarMatch(){

const filas=document.querySelectorAll("#tabla tbody tr");

let html="<table><tr><th>BL</th><th>Destinatario</th><th>Población</th><th>Tier</th></tr>";

filas.forEach(f=>{

const cliente=f.children[1].innerText;
const ciudad=f.children[2].innerText;

let tier="NO";
let tipo="red";

const match=masterData.find(m=>
normalize(m.DESTINATARIO||m.destinatario).includes(normalize(cliente)) &&
normalize(m.POBLACION||m.poblacion).includes(normalize(ciudad))
);

if(match){
tier=match.TIERS || match.tiers || "-";
tipo="green";
}

html+=`<tr class="${tipo}">
<td>${f.children[0].innerText}</td>
<td>${cliente}</td>
<td>${ciudad}</td>
<td>${tier}</td>
</tr>`;

});

html+="</table>";

document.getElementById("resultado").innerHTML=html;

}

</script>

</body>
</html>
