<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INLET OCR</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;}

.header{
background:#005baa;color:white;padding:18px 25px;
display:flex;justify-content:space-between;
}

.container{
max-width:1100px;margin:40px auto;
background:white;padding:30px;border-radius:8px;
}

.btn{
background:#005baa;color:white;padding:10px 20px;
border:none;border-radius:6px;cursor:pointer;margin-right:10px;
}

table{width:100%;border-collapse:collapse;margin-top:20px;}
th{background:#005baa;color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #ddd;}

.green{background:#d9f2e3;}
.orange{background:#fff2cc;}
.red{background:#ffd6d6;}

td[contenteditable]{background:#fff8e1;}
</style>
</head>

<body>

<div class="header">
<span>Sistema Operativo Interno</span>
<button onclick="history.back()">Volver</button>
</div>

<div class="container">

<h2>INLET OCR</h2>

<label class="btn">
Subir Maestro
<input type="file" id="fileMaster" accept=".xlsx" hidden>
</label>

<label class="btn">
Subir PDF
<input type="file" id="filePDF" accept="application/pdf" hidden>
</label>

<button id="btnProcesar" class="btn" style="display:none;">
Procesar Datos
</button>

<div id="status"></div>

<table id="tablaPreview">
<thead>
<tr>
<th>BL</th>
<th>Destinatario</th>
<th>Población</th>
<th>Palets</th>
<th>Bultos</th>
<th>Peso</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="resultado"></div>

<pre id="debug" style="font-size:10px;max-height:200px;overflow:auto;"></pre>

</div>

<script>

let masterData=[];
let ocrFilas=[];
let masterOK=false;
let pdfOK=false;

const btnProcesar=document.getElementById("btnProcesar");

function checkReady(){
btnProcesar.style.display=(masterOK && pdfOK)?"inline-block":"none";
}

/* NORMALIZAR */
function norm(s){
return (s||"").toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();
}

/* EXCEL */
document.getElementById("fileMaster").addEventListener("change",async e=>{
const file=e.target.files[0];
const data=await file.arrayBuffer();
const wb=XLSX.read(data,{type:'array'});
const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

masterData=json.map(r=>({
dest: r["DESTINATARIO"] || r.destinatario || "",
pob: r["POBLACIÓN"] || r.poblacion || "",
tiers: r["TIERS"] || r.tiers || ""
}));

masterOK=true;
checkReady();
});

/* OCR CON COORDENADAS */
document.getElementById("filePDF").addEventListener("change",async e=>{

const file=e.target.files[0];
const url=URL.createObjectURL(file);

document.getElementById("status").innerText="Procesando OCR...";

const result=await Tesseract.recognize(url,"spa");

const words=result.data.words;

/* FILTRO POR TUS COORDENADAS */
const filtradas=words.filter(w=>{
return w.bbox.x0>=40 &&
       w.bbox.x1<=1400 &&
       w.bbox.y0>=373 &&
       w.bbox.y1<=873;
});

/* AGRUPAR POR LINEAS */
const lineas={};

filtradas.forEach(w=>{
const y=Math.floor(w.bbox.y0/10)*10;
if(!lineas[y]) lineas[y]=[];
lineas[y].push(w.text);
});

const texto=Object.keys(lineas)
.sort((a,b)=>a-b)
.map(y=>lineas[y].join(" "))
.join("\n");

/* DEBUG */
document.getElementById("debug").innerText=texto;

/* PARSEAR */
parsearOCR(texto);

pdfOK=true;
checkReady();

});

/* PARSER MEJORADO */
function parsearOCR(text){

const tbody=document.querySelector("#tablaPreview tbody");
tbody.innerHTML="";
ocrFilas=[];

const lineas=text.split("\n");

lineas.forEach(l=>{

if(l.length<15) return;

/* BUSCAR NUMEROS */
const numeros=l.match(/\d+/g);
if(!numeros || numeros.length<3) return;

const peso=numeros.pop();
const bultos=numeros.pop();
const palets=numeros.pop();

/* BL */
const blMatch=l.match(/\d{9,}(#\d+)*/);
const bl=blMatch?blMatch[0]:"";

/* TEXTO LIMPIO */
let limpio=l.replace(bl,"")
.replace(peso,"")
.replace(bultos,"")
.replace(palets,"");

/* SEPARAR TEXTO */
let partes=limpio.split(/\s{2,}/);

if(partes.length<2) return;

const pob=partes.pop();
const dest=partes.join(" ");

ocrFilas.push({bl,dest,pob,palets,bultos,peso});

});

/* MOSTRAR PREVIEW */
ocrFilas.forEach(r=>{
const tr=document.createElement("tr");
tr.innerHTML=`
<td contenteditable>${r.bl}</td>
<td contenteditable>${r.dest}</td>
<td contenteditable>${r.pob}</td>
<td>${r.palets}</td>
<td>${r.bultos}</td>
<td>${r.peso}</td>
`;
tbody.appendChild(tr);
});

document.getElementById("status").innerText="Revisa datos y pulsa Procesar";

}

/* MATCH FINAL */
btnProcesar.onclick=()=>{

let html="<table><tr><th>BL</th><th>Dest</th><th>Pob</th><th>Tiers</th></tr>";

ocrFilas.forEach(d=>{

let tiers="NO";
let tipo="red";

const exact=masterData.find(m=>
norm(m.dest)===norm(d.dest) &&
norm(m.pob)===norm(d.pob)
);

if(exact){
tiers=exact.tiers;
tipo="green";
}else{
const fuzzy=masterData.find(m=>
norm(m.dest).includes(norm(d.dest))
);
if(fuzzy){
tiers=fuzzy.tiers;
tipo="orange";
}
}

html+=`<tr class="${tipo}">
<td>${d.bl}</td>
<td>${d.dest}</td>
<td>${d.pob}</td>
<td>${tiers}</td>
</tr>`;

});

html+="</table>";

document.getElementById("resultado").innerHTML=html;

};

</script>

</body>
</html>
