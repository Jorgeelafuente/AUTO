<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INLET OCR</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;}

.header{
background:#005baa;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
font-size:20px;
}

.backBtn{
background:white;
color:#005baa;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1100px;
margin:40px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
color:#005baa;
border-bottom:2px solid #005baa;
padding-bottom:8px;
}

.btn{
background:#005baa;
color:white;
border:none;
padding:12px 20px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

input[type=file]{display:none;}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{background:#005baa;color:white;padding:10px;}
td{padding:10px;border-bottom:1px solid #ddd;}

.green{background:#d9f2e3;}
.orange{background:#fff2cc;}
.red{background:#ffd6d6;}

</style>

<!-- LIBRERÍAS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

</head>

<body>

<div class="header">
<span>Sistema Operativo Interno</span>
<button class="backBtn" onclick="history.back()">Volver</button>
</div>

<div class="container">

<h2>INLET OCR</h2>

<!-- BOTONES -->
<label class="btn">
Subir Maestro
<input type="file" id="fileMaster" accept=".xlsx">
</label>

<label class="btn">
Subir PDF
<input type="file" id="filePDF" accept="application/pdf">
</label>

<button id="processBtn" class="btn" style="display:none;">
Procesar Datos
</button>

<div id="status"></div>

<div id="resultado"></div>

</div>

<script>

let masterData=[];
let pdfFile=null;

/* CONTROL BOTÓN */
function checkReady(){
if(masterData.length && pdfFile){
document.getElementById("processBtn").style.display="inline-block";
}
}

/* NORMALIZAR */
function normalize(s){
return (s||"")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();
}

/* CARGAR EXCEL */
document.getElementById("fileMaster").addEventListener("change",async e=>{

const file=e.target.files[0];
const data=await file.arrayBuffer();

const wb=XLSX.read(data,{type:'array'});
const sheet=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

masterData=sheet;

checkReady();

});

/* GUARDAR PDF */
document.getElementById("filePDF").addEventListener("change",e=>{
pdfFile=e.target.files[0];
checkReady();
});

/* PROCESAR TODO */
document.getElementById("processBtn").addEventListener("click",async()=>{

document.getElementById("status").innerText="Procesando OCR...";

const pdfjsLib = window['pdfjsLib'];
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

const data = new Uint8Array(await pdfFile.arrayBuffer());
const pdf = await pdfjsLib.getDocument({data}).promise;

let textoFinal="";

/* OCR POR PÁGINA */
for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i);
const viewport=page.getViewport({scale:2});

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({canvasContext:ctx,viewport}).promise;

const {data:{text}}=await Tesseract.recognize(canvas,"spa");

textoFinal+=text+"\n";

}

/* PARSEAR TEXTO */
const resultados=parsearTexto(textoFinal);

/* CRUZAR CON MAESTRO */
const final=cruzarConMaestro(resultados);

/* MOSTRAR */
render(final);

document.getElementById("status").innerText="Proceso completado";

});

/* PARSEO INTELIGENTE */
function parsearTexto(text){

const lineas=text.split("\n");

const datos=[];

lineas.forEach(l=>{

if(l.length<30) return;

const regex=/(\d+[#\d]*)\s+(.+?)\s+([A-Za-z\s]+)\s+(\d+)\s+(\d+)\s+([\d,\.]+)/;

const m=l.match(regex);

if(m){

datos.push({
pedido:m[1],
cliente:m[2],
ciudad:m[3],
palets:m[4],
bultos:m[5],
peso:m[6]
});

}

});

return datos;

}

/* CRUCE CON EXCEL */
function cruzarConMaestro(datos){

return datos.map(d=>{

let tier="NO";
let tipo="red";

const match=masterData.find(m=>
normalize(m.DESTINATARIO || m.destinatario || "")
.includes(normalize(d.cliente))
);

if(match){
tier=match.TIERS || match.tiers || "-";
tipo="green";
}

return {...d,tier,tipo};

});

}

/* RENDER */
function render(datos){

let html=`
<table>
<tr>
<th>Destinatario</th>
<th>Población</th>
<th>Tiers</th>
<th>Palets</th>
<th>Bultos</th>
<th>Peso</th>
</tr>
`;

datos.forEach(d=>{

html+=`
<tr class="${d.tipo}">
<td>${d.cliente}</td>
<td>${d.ciudad}</td>
<td>${d.tier}</td>
<td>${d.palets}</td>
<td>${d.bultos}</td>
<td>${d.peso}</td>
</tr>
`;

});

html+="</table>";

document.getElementById("resultado").innerHTML=html;

}

</script>

</body>
</html>
