<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sistema Autosilo</title>

<!-- LIBRERIAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

<style>

:root{
  --primary-blue:#0078c8;
  --primary-dark:#005a9e;
  --light-bg:#f2f5f8;
  --border-grey:#d9e1ea;
}

body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;
  background:var(--light-bg);
  color:#2b2b2b;
}

/* TOPBAR */

.topbar{
  background:var(--primary-blue);
  color:white;
  padding:12px 30px;
  font-size:18px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.backBtn{
  background:white;
  color:#0078c8;
  border:none;
  padding:6px 12px;
  border-radius:4px;
  font-weight:600;
  cursor:pointer;
}

.backBtn:hover{
  background:#f2f2f2;
}

/* CONTENEDOR */

.container{
  max-width:1200px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:6px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
  color:var(--primary-dark);
  border-bottom:2px solid var(--primary-blue);
  padding-bottom:8px;
}

/* CONTROLES */

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.button{
  background:var(--primary-blue);
  border:none;
  padding:10px 16px;
  color:white;
  font-weight:600;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

.button:hover{
  background:var(--primary-dark);
}

.filename{
  font-size:13px;
  color:#555;
  align-self:center;
}

/* TABLA */

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:14px;
}

th{
  background:var(--primary-blue);
  color:white;
  padding:10px;
  text-align:left;
}

td{
  padding:8px;
  border-bottom:1px solid var(--border-grey);
}

tr.green{
  background:#e6f4ea;
}

tr.orange{
  background:#fff3cd;
}

tr.red{
  background:#f8d7da;
}

tr:hover{
  background:#eef5fb;
}

/* BOTON PROCESAR */

#btnProcesar{
  display:none;
}

</style>
</head>

<body>

<div class="topbar">

  <div>Sistema Operativo Interno</div>

  <button class="backBtn"
  onclick="window.location.href='../menu.html'">
  Volver
  </button>

</div>

<div class="container">

<h1>SILOMAR</h1>

<div class="controls">

  <button class="button" id="btnMaestro">
  Subir Archivo Maestro
  </button>

  <input
  type="file"
  id="fileMaestro"
  accept=".xlsx"
  style="display:none">

  <div class="filename" id="nombreMaestro">
  Ningún archivo maestro
  </div>

  <button class="button" id="btnDiario">
  Subir Archivo Diario
  </button>

  <input
  type="file"
  id="fileDiario"
  accept=".pdf"
  style="display:none">

  <div class="filename" id="nombreDiario">
  Ningún archivo diario
  </div>

  <button class="button" id="btnProcesar">
  Procesar Datos
  </button>

</div>

<div id="resultado"></div>

</div>

<script>

/* ELEMENTOS */

const fileMaestro=document.getElementById('fileMaestro');
const fileDiario=document.getElementById('fileDiario');

const nombreMaestro=document.getElementById('nombreMaestro');
const nombreDiario=document.getElementById('nombreDiario');

const btnMaestro=document.getElementById('btnMaestro');
const btnDiario=document.getElementById('btnDiario');
const btnProcesar=document.getElementById('btnProcesar');

const resultado=document.getElementById('resultado');

/* VARIABLES */

let maestroData=[];
let diarioFilas=[];

let maestroCargado=false;
let diarioCargado=false;

/* MOSTRAR BOTON */

function comprobarArchivos(){

  if(maestroCargado && diarioCargado){

    btnProcesar.style.display="inline-block";

  }else{

    btnProcesar.style.display="none";

  }

}

/* BOTONES */

btnMaestro.onclick=()=>fileMaestro.click();
btnDiario.onclick=()=>fileDiario.click();

/* NORMALIZAR */

function normalizeText(s){

  return String(s || "")
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .trim();

}

/* CARGAR MAESTRO */

fileMaestro.onchange=async(e)=>{

  try{

    const file=e.target.files[0];

    if(!file) return;

    maestroCargado=true;

    comprobarArchivos();

    nombreMaestro.innerText=file.name;

    const ab=await file.arrayBuffer();

    const wb=XLSX.read(ab,{type:'array'});

    const raw=XLSX.utils.sheet_to_json(
      wb.Sheets[wb.SheetNames[0]],
      {defval:""}
    );

    maestroData=raw.map(r=>{

      const obj={};

      for(const k in r){

        const clean=k
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g,"");

        obj[clean]=r[k];

      }

      return{

        destinatario:obj.destinatario || obj.nombre || "",

        direccion:obj.direccion || "",

        codlocalidad:
        obj.codigopostalylocalidad ||
        obj.cpylocalidad ||
        "",

        tiers:obj.tiers || ""

      };

    });

    console.log("MAESTRO:",maestroData);

  }catch(error){

    console.error(error);

    alert("Error leyendo archivo maestro");

  }

};

/* CARGAR PDF */

fileDiario.onchange=async(e)=>{

  try{

    const file=e.target.files[0];

    if(!file) return;

    diarioCargado=true;

    comprobarArchivos();

    nombreDiario.innerText=file.name;

    diarioFilas=await extraerFilasPDF(file);

    console.log("PDF:",diarioFilas);

  }catch(error){

    console.error(error);

    alert("Error leyendo PDF");

  }

};

/* PROCESAR */

btnProcesar.onclick=()=>{

  try{

    procesar();

  }catch(error){

    console.error(error);

    alert("Error procesando datos");

  }

};

/* EXTRAER PDF */

async function extraerFilasPDF(file){

  pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

  const data=new Uint8Array(await file.arrayBuffer());

  const pdf=await pdfjsLib.getDocument({data}).promise;

  let items=[];

  for(let i=1;i<=pdf.numPages;i++){

    const page=await pdf.getPage(i);

    const content=await page.getTextContent();

    items=items.concat(

      content.items.map(it=>({

        str:it.str || "",

        y:Math.floor(it.transform[5])

      }))

    );

  }

  const lineas={};

  items.forEach(it=>{

    if(!lineas[it.y]){

      lineas[it.y]=[];

    }

    lineas[it.y].push(it.str);

  });

  const filas=Object.keys(lineas)

  .sort((a,b)=>b-a)

  .map(y=>lineas[y].join(' ').trim())

  .filter(t=>t.length>0);

  const regex=/([A-Z0-9&\.\s\-\/ÑÁÉÍÓÚÜÇ,]+)\s+(\d{4,5})\s*-\s*([A-Za-zÁÉÍÓÚÜñçÇ'\.\s\-]+)/;

  const resultados=[];

  filas.forEach(l=>{

    const m=l.match(regex);

    if(m){

      resultados.push({

        destinatario:(m[1] || "").trim(),

        cp:(m[2] || "").trim(),

        localidad:(m[3] || "").trim()

      });

    }

  });

  return resultados;

}

/* PROCESAR DATOS */

function procesar(){

  if(!maestroData.length){

    alert("No se ha cargado el maestro");

    return;

  }

  if(!diarioFilas.length){

    alert("No se detectaron filas del PDF");

    return;

  }

  const fuse=new Fuse(maestroData,{

    keys:[
      'destinatario',
      'direccion',
      'codlocalidad'
    ],

    threshold:0.35

  });

  const resultados=diarioFilas.map(d=>{

    const exact=maestroData.find(m=>

      normalizeText(m.destinatario)
      .includes(
        normalizeText(d.destinatario)
      )

      &&

      normalizeText(m.codlocalidad)
      .includes(
        normalizeText(d.cp)
      )

    );

    if(exact){

      return{

        destinatario:d.destinatario,

        tiers:exact.tiers || "No encontrado",

        tipo:'exact'

      };

    }

    const fuzzy=fuse.search(d.destinatario || "");

    if(fuzzy.length>0){

      const top=fuzzy[0].item;

      return{

        destinatario:d.destinatario,

        tiers:top.tiers || "No encontrado",

        tipo:'fuzzy'

      };

    }

    return{

      destinatario:d.destinatario,

      tiers:"No encontrado",

      tipo:'none'

    };

  });

  mostrarTabla(resultados);

}

/* MOSTRAR TABLA */

function mostrarTabla(datos){

  let html=`
  <table>

  <thead>
  <tr>
    <th>Destinatario</th>
    <th>Tiers</th>
  </tr>
  </thead>

  <tbody>
  `;

  datos.forEach(r=>{

    const clase=
      r.tipo==='exact'
      ?'green'
      :r.tipo==='fuzzy'
      ?'orange'
      :'red';

    html+=`
    <tr class="${clase}">
      <td>${r.destinatario}</td>
      <td>${r.tiers}</td>
    </tr>
    `;

  });

  html+=`
  </tbody>
  </table>
  `;

  resultado.innerHTML=html;

}

</script>

</body>
</html>
